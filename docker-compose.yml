services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_planner_pg
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_planner
    ports:
      - "5433:5432"
    volumes:
      - travel_pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_pg_data:
